name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src

  site:
    name: Website and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.65.1
          python -m playwright install --with-deps chromium
      - name: Install the Inter font for screenshots
        continue-on-error: true
        run: sudo apt-get install -y --no-install-recommends fonts-inter
      - name: Build the site
        run: python scripts/build_site.py --out _site
      - name: Run the site and browser tests
        run: python -m unittest -v tests.test_site tests.test_site_browser
        env:
          PYTHONPATH: src
          JARVIS_REQUIRE_BROWSER_TESTS: "1"
          JARVIS_SCREENSHOT_DIR: screenshots
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: screenshots/
          if-no-files-found: warn
      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site/
          include-hidden-files: true
